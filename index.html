<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WarungKu — Sistem Manajemen Warung Makan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a2e1a;
  --green-900:#14532d;
  --green-700:#166534;
  --green-600:#16a34a;
  --green-500:#22c55e;
  --green-100:#dcfce7;
  --green-50:#f0fdf4;
  --paper:#f7fdf7;
  --paper-2:#edf7ed;
  --line:#c6e5c6;
  --amber-600:#b5790a;
  --amber-500:#d99a1f;
  --amber-100:#fbecd0;
  --red-600:#b3413a;
  --red-100:#f9e3e0;
  --white:#ffffff;
  --font-body:"Inter","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --radius:8px;
  --radius-lg:14px;
  --ease:cubic-bezier(.25,.1,.25,1);
  --shadow-xs:0 1px 2px rgba(20,83,45,.06);
  --shadow-sm:0 1px 2px rgba(20,83,45,.05),0 2px 6px rgba(20,83,45,.06);
  --shadow-md:0 2px 6px rgba(20,83,45,.06),0 12px 28px rgba(20,83,45,.10);
  --shadow-lg:0 8px 16px rgba(20,83,45,.08),0 24px 48px rgba(20,83,45,.16);
}
body.tema-dark{
  --ink:#e2e8f0;--green-900:#0f172a;--green-700:#1e40af;--green-600:#2563eb;
  --green-500:#3b82f6;--green-100:#1e3a5f;--green-50:#172033;
  --paper:#0f172a;--paper-2:#1e293b;--line:#334155;
  --amber-600:#f59e0b;--amber-500:#fbbf24;--amber-100:#2d2206;
  --red-600:#ef4444;--red-100:#2d1515;--white:#1e293b;
  background:#0f172a;color:#e2e8f0;
}
body.tema-dark .card,body.tema-dark .kpi-card,body.tema-dark .modal{background:#1e293b;border-color:#334155;}
body.tema-dark input,body.tema-dark select,body.tema-dark textarea{background:#0f172a;color:#e2e8f0;border-color:#334155;}
body.tema-dark tbody tr:hover{background:#1e3a5f;}
body.tema-dark .login-card{background:#1e293b;border-color:#334155;}
body.tema-dark .produk-tile{background:#1e293b;border-color:#334155;}
body.tema-dark thead th{color:#94a3b8;}
body.tema-dark .kpi-card .label,body.tema-dark .kpi-card .sub{color:#94a3b8;}
body.tema-hitam{
  --ink:#f1f5f9;--green-900:#000;--green-700:#111;--green-600:#222;
  --green-500:#555;--green-100:#1a1a1a;--green-50:#0d0d0d;
  --paper:#000;--paper-2:#111;--line:#333;
  --amber-600:#facc15;--amber-500:#fde047;--amber-100:#1c1a00;
  --red-600:#ef4444;--red-100:#200000;--white:#111;
  background:#000;color:#f1f5f9;
}
body.tema-hitam .card,body.tema-hitam .kpi-card,body.tema-hitam .modal{background:#111;border-color:#333;}
body.tema-hitam input,body.tema-hitam select,body.tema-hitam textarea{background:#000;color:#f1f5f9;border-color:#333;}
body.tema-hitam tbody tr:hover{background:#1a1a1a;}
body.tema-hitam .login-card{background:#111;border-color:#333;}
body.tema-hitam .produk-tile{background:#111;border-color:#333;}
body.tema-hitam .sidebar{background:#0d0d0d;}
body.tema-hitam .nav-item.active{background:#fde047;color:#000;}
body.tema-putih{
  --ink:#111827;--green-900:#1f2937;--green-700:#374151;--green-600:#4b5563;
  --green-500:#6b7280;--green-100:#f3f4f6;--green-50:#f9fafb;
  --paper:#fff;--paper-2:#f3f4f6;--line:#e5e7eb;
  --amber-600:#d97706;--amber-500:#f59e0b;--amber-100:#fef3c7;
  --red-600:#dc2626;--red-100:#fee2e2;--white:#fff;
  background:#fff;color:#111827;
}
body.tema-putih .sidebar{background:#1f2937;}
body.tema-putih .card,body.tema-putih .kpi-card{background:#fff;border-color:#e5e7eb;}
.tema-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.tema-btn{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--white);cursor:pointer;font-size:12px;font-weight:600;color:var(--ink);transition:border-color .15s,transform .1s;min-width:72px;}
.tema-btn:hover{transform:scale(1.05);}
.tema-btn.aktif{border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-100);}
.tema-swatch{width:36px;height:36px;border-radius:50%;border:2px solid rgba(0,0,0,.1);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--amber-100);}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green-600);outline-offset:2px;}
/* LOGIN — Premium Redesign */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes floatOrb{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-18px) scale(1.04);}}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.3);}50%{box-shadow:0 0 0 10px rgba(34,197,94,0);}}
@keyframes rotateDash{to{stroke-dashoffset:-40;}}

.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0a1f0f;
  padding:20px;overflow:hidden;position:relative;
}
.login-screen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 20% 30%,rgba(22,163,74,.22) 0%,transparent 60%),
             radial-gradient(ellipse 50% 50% at 80% 70%,rgba(20,83,45,.4) 0%,transparent 60%),
             radial-gradient(ellipse 40% 40% at 60% 10%,rgba(34,197,94,.08) 0%,transparent 50%);
  pointer-events:none;
}

/* Floating orbs */
.login-orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;animation:floatOrb 7s ease-in-out infinite;}
.login-orb-1{width:320px;height:320px;background:radial-gradient(circle,rgba(34,197,94,.18),transparent 70%);top:-80px;left:-80px;animation-delay:0s;}
.login-orb-2{width:280px;height:280px;background:radial-gradient(circle,rgba(20,83,45,.35),transparent 70%);bottom:-60px;right:-40px;animation-delay:-3.5s;}
.login-orb-3{width:180px;height:180px;background:radial-gradient(circle,rgba(217,154,31,.12),transparent 70%);bottom:30%;left:20%;animation-delay:-1.8s;}

/* Grid dots pattern */
.login-grid{
  position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:radial-gradient(circle,#4ade80 1px,transparent 1px);
  background-size:32px 32px;
}

.login-card{
  width:100%;max-width:920px;display:grid;grid-template-columns:1fr 1fr;
  border-radius:24px;overflow:hidden;position:relative;z-index:2;
  box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  animation:fadeUp .55s cubic-bezier(.22,.68,0,1.2) both;
}
@media(max-width:760px){
  .login-card{grid-template-columns:1fr;}
  .login-brand{display:none;}
}

/* LEFT — brand panel (gaya "poster produk": headline tebal + hero ilustrasi, seperti banner kasir minimarket) */
.login-brand{
  background:#fcfdfb;
  color:var(--ink);padding:0;display:flex;flex-direction:column;
  justify-content:space-between;position:relative;overflow:hidden;min-height:560px;
  border-right:1px solid var(--line);
}
/* Decorative ring top-right */
.login-brand::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:260px;height:260px;border-radius:50%;
  border:40px solid rgba(34,197,94,.06);pointer-events:none;
}
.login-brand::after{
  content:'';position:absolute;bottom:-40px;left:-40px;
  width:200px;height:200px;border-radius:50%;
  border:30px solid rgba(20,83,45,.04);pointer-events:none;
}

.login-brand-content{position:relative;z-index:2;padding:36px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}

.brand-kicker{
  font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--green-600);margin-bottom:8px;
}
.brand-headline{font-weight:800;font-size:23px;letter-spacing:-.3px;color:#0f1f0f;line-height:1.2;margin:0 0 6px;}
.brand-tagline{font-size:13px;line-height:1.55;color:#5c6a55;max-width:300px;margin:0 auto 14px;font-weight:500;}

/* Hero ilustrasi perangkat kasir */
.brand-hero{width:100%;max-width:340px;margin:2px auto 10px;}
.brand-hero svg{width:100%;height:auto;display:block;}

/* Feature pills */
.login-tags{display:flex;flex-wrap:wrap;gap:7px;position:relative;z-index:2;justify-content:center;margin-top:2px;}
.login-tag{
  font-size:11px;font-weight:600;padding:5px 11px;border-radius:100px;
  background:var(--green-50);border:1px solid var(--line);
  color:var(--green-700);letter-spacing:.1px;
  transition:background .2s,border-color .2s;display:flex;align-items:center;gap:5px;
}
.login-tag:hover{background:var(--green-100);border-color:var(--green-500);}

.login-credit{
  position:relative;z-index:2;
  padding:16px 30px;font-size:11.5px;color:#9aa494;
  border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.login-credit::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green-500);box-shadow:0 0 8px rgba(34,197,94,.5);animation:pulseGlow 2s ease-in-out infinite;}

/* RIGHT — form panel */
.login-form-wrap{
  background:#fff;padding:52px 44px;
  display:flex;flex-direction:column;justify-content:center;
}

.login-form-header{margin-bottom:32px;}
.login-form-header .lf-eyebrow{
  font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--green-600);margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.login-form-header .lf-eyebrow::before{content:'';display:inline-block;width:16px;height:2px;background:var(--green-500);border-radius:2px;}
.login-form-wrap h2{font-size:26px;font-weight:800;margin:0 0 6px;color:#0f1f0f;letter-spacing:-.5px;line-height:1.15;}
.login-form-wrap .sub{font-size:13.5px;color:#8a9080;margin:0;line-height:1.5;}

/* Fields */
.field{margin-bottom:18px;}
.field label{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:700;color:#4a5240;margin-bottom:8px;
  letter-spacing:.3px;text-transform:uppercase;
}
.field-input-wrap{position:relative;}
.field-input-wrap .field-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:15px;opacity:.45;pointer-events:none;
}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px 12px 42px;
  border:1.5px solid #e2e8e0;border-radius:10px;
  font-size:14.5px;background:#f8fbf8;color:#1a2e1a;
  transition:border-color .2s,box-shadow .2s,background .2s;
  appearance:none;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--green-500);background:#fff;
  box-shadow:0 0 0 4px rgba(34,197,94,.1);outline:none;
}
.field input::placeholder{color:#b0bba8;}

/* Login button */
#btnLogin{
  width:100%;padding:14px;border-radius:12px;
  font-size:15px;font-weight:700;letter-spacing:.1px;
  background:linear-gradient(135deg,#16a34a,#14532d);
  color:#fff;border:none;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .2s;
  box-shadow:0 4px 16px rgba(22,101,52,.35);
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:6px;
}
#btnLogin::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.12) 50%,transparent 100%);
  background-size:200% 100%;
  animation:shimmer 2.5s ease-in-out infinite;
  opacity:0;transition:opacity .3s;
}
#btnLogin:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(22,101,52,.45);}
#btnLogin:hover::before{opacity:1;}
#btnLogin:active{transform:scale(.98) translateY(0);}

/* Trial badge */
.trial-badge{
  margin-top:14px;padding:10px 16px;border-radius:10px;
  background:linear-gradient(135deg,#fffbeb,#fef3c7);
  border:1px solid #fde68a;
  display:flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:600;color:#92400e;
}
.trial-badge .tb-bar{
  flex:1;height:4px;background:#fde68a;border-radius:2px;overflow:hidden;
}
.trial-badge .tb-fill{height:100%;width:80%;background:linear-gradient(90deg,#f59e0b,#d97706);border-radius:2px;}

/* Error */
#loginErr{
  display:none;padding:10px 14px;border-radius:9px;
  background:#fef2f2;border:1px solid #fecaca;
  color:#dc2626;font-size:13px;font-weight:500;margin-bottom:14px;
  display:flex;align-items:center;gap:7px;
}
#loginErr::before{content:'⚠';font-size:14px;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:var(--radius);font-size:13.5px;font-weight:600;border:none;transition:background-color .15s,transform .1s,box-shadow .15s;cursor:pointer;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green-600);color:#fff;}
.btn-primary:hover{background:var(--green-700);}
.btn-ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost:hover{background:var(--green-50);border-color:var(--green-500);}
.btn-danger{background:var(--red-600);color:#fff;}
.btn-danger:hover{background:#922b25;}
.btn-amber{background:var(--amber-500);color:#fff;}
.btn-amber:hover{background:var(--amber-600);}
.btn-full{width:100%;justify-content:center;}
/* LAYOUT */
/* ===== TOPBAR LAYOUT ===== */
.app-layout{display:flex;flex-direction:column;min-height:100vh;}

/* Top brand bar */
.topbar-brand{
  background:linear-gradient(135deg,var(--green-900) 0%,var(--green-700) 100%);
  color:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:52px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.18);position:sticky;top:0;z-index:100;
}
.topbar-brand-left{display:flex;align-items:center;gap:10px;}
.topbar-brand-logo{font-size:22px;line-height:1;}
.topbar-brand-name{font-weight:800;font-size:16px;letter-spacing:.2px;color:#fff;white-space:nowrap;}
.topbar-brand-sub{font-size:11px;color:rgba(255,255,255,.55);font-weight:400;letter-spacing:.2px;margin-left:4px;}
.topbar-user{display:flex;align-items:center;gap:10px;font-size:12.5px;}
.topbar-user-info{color:rgba(255,255,255,.7);display:flex;align-items:center;gap:5px;}
.topbar-user-name{font-weight:600;color:#fff;}
.topbar-user-role{font-size:11px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px;}
.btn-logout-top{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);cursor:pointer;transition:background .15s;}
.btn-logout-top:hover{background:rgba(255,255,255,.22);}

/* Nav bar */
.topbar-nav{
  background:var(--green-700);
  display:flex;align-items:stretch;gap:0;
  overflow-x:auto;overflow-y:visible;flex-shrink:0;
  border-bottom:1px solid rgba(0,0,0,.15);
  scrollbar-width:none;
  position:relative;z-index:90;
}
.topbar-nav::-webkit-scrollbar{display:none;}

/* Group label inside nav (used only for the flat "Utama" group) */
.nav-group{display:flex;align-items:stretch;position:relative;}
.nav-group-label{
  font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:rgba(255,255,255,.38);padding:0 10px;
  display:flex;align-items:center;white-space:nowrap;
  border-right:1px solid rgba(255,255,255,.08);
  user-select:none;
}
.nav-group-divider{width:1px;background:rgba(255,255,255,.12);margin:8px 2px;}

.nav-item{
  display:flex;align-items:center;gap:6px;
  padding:0 14px;height:42px;
  font-size:13px;font-weight:500;color:rgba(255,255,255,.78);
  cursor:pointer;transition:background-color .15s,color .15s;
  border:none;background:none;white-space:nowrap;
  position:relative;border-bottom:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-item.active{
  background:rgba(255,255,255,.12);color:#fff;font-weight:700;
  border-bottom-color:#4ade80;
}
.nav-item .ico{font-size:15px;flex-shrink:0;}
.nav-badge{margin-left:4px;background:var(--red-600);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;font-weight:700;}

/* Dropdown group (Inventori / Laporan & Data / Admin, etc.) */
.nav-dropdown{position:relative;flex-shrink:0;}
.nav-dropdown-btn{
  display:flex;align-items:center;gap:6px;
  padding:0 14px;height:42px;
  font-size:13px;font-weight:500;color:rgba(255,255,255,.78);
  cursor:pointer;transition:background-color .15s,color .15s;
  border:none;background:none;white-space:nowrap;
  border-bottom:3px solid transparent;
}
.nav-dropdown-btn .ico{font-size:15px;flex-shrink:0;}
.nav-dropdown-btn .caret{font-size:9px;opacity:.65;transition:transform .15s;margin-left:1px;}
.nav-dropdown-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-dropdown-btn.active{
  background:rgba(255,255,255,.12);color:#fff;font-weight:700;
  border-bottom-color:#4ade80;
}
.nav-dropdown.open .nav-dropdown-btn{background:rgba(255,255,255,.14);color:#fff;}
.nav-dropdown.open .nav-dropdown-btn .caret{transform:rotate(180deg);}

.nav-dropdown-menu{
  position:fixed;top:0;left:0;
  min-width:210px;background:var(--white,#fff);
  border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 28px rgba(0,0,0,.2);
  padding:6px;display:none;flex-direction:column;gap:1px;
  z-index:500;
}
.nav-dropdown.open .nav-dropdown-menu{display:flex;}
.nav-dropdown-menu .nav-item{
  height:auto;padding:9px 10px;border-radius:7px;border-bottom:none;
  color:var(--ink);justify-content:flex-start;font-size:13.5px;font-weight:500;
}
.nav-dropdown-menu .nav-item:hover{background:var(--green-50);color:var(--green-900);}
.nav-dropdown-menu .nav-item.active{
  background:var(--green-100);color:var(--green-900);font-weight:700;
}
.nav-dropdown-menu .nav-badge{margin-left:auto;}

/* Poin info di topbar */
.topbar-poin{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:rgba(255,255,255,.7);
  background:rgba(255,255,255,.1);border-radius:8px;
  padding:3px 10px;margin-right:4px;
}
.topbar-poin .pts{font-family:var(--font-mono);font-weight:700;color:#fde047;}

/* Main content */
.main{background:var(--paper);padding:22px 26px;overflow-x:hidden;flex:1;}
@media(max-width:900px){.main{padding:14px 12px;}}

/* Responsive — collapse nav on mobile */
@media(max-width:760px){
  .topbar-nav{gap:0;}
  .nav-item,.nav-dropdown-btn{padding:0 10px;font-size:12px;}
  .nav-group-label{display:none;}
  .topbar-brand-sub{display:none;}
  .nav-dropdown-menu{left:auto;right:0;}
}

/* Keep sidebar-related dark theme overrides working via topbar */
body.tema-dark .topbar-brand,body.tema-dark .topbar-nav{background:#1e293b;}
body.tema-dark .topbar-brand{border-bottom:1px solid #334155;}
body.tema-dark .nav-dropdown-menu{background:#1e293b;}
body.tema-hitam .topbar-brand{background:#0d0d0d;}
body.tema-hitam .topbar-nav{background:#111;}
body.tema-hitam .nav-item.active,body.tema-hitam .nav-dropdown-btn.active{border-bottom-color:#fde047;color:#fde047;}
body.tema-hitam .nav-dropdown-menu{background:#111;}
body.tema-hitam .nav-dropdown-menu .nav-item.active{color:#fde047;}
body.tema-putih .topbar-brand{background:#1f2937;}
body.tema-putih .topbar-nav{background:#374151;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-size:22px;font-weight:800;margin:0 0 3px;color:var(--green-900);}
body.tema-dark .page-head h1{color:#e2e8f0;}
body.tema-hitam .page-head h1{color:#f1f5f9;}
.page-head .desc{font-size:13px;color:#6b6456;margin:0;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
/* CARD */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;margin-bottom:18px;box-shadow:var(--shadow-xs);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-head h3{font-size:15px;font-weight:700;margin:0;}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;margin-bottom:18px;}
.kpi-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow-xs);}
.kpi-card .bar{position:absolute;top:0;left:0;right:0;height:3px;background:var(--green-500);}
.kpi-card.amber .bar{background:var(--amber-500);}
.kpi-card.red .bar{background:var(--red-600);}
.kpi-card .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#7a7060;margin-bottom:5px;}
.kpi-card .value{font-size:22px;font-weight:800;font-family:var(--font-mono);color:var(--green-900);line-height:1;}
body.tema-dark .kpi-card .value{color:#e2e8f0;}
body.tema-hitam .kpi-card .value{color:#f1f5f9;}
.kpi-card .sub{font-size:11px;color:#8a8270;margin-top:5px;}
/* TABS */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;}
.tab-btn{background:none;border:none;padding:9px 16px;font-size:13.5px;font-weight:600;color:#8a8270;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;}
.tab-btn.active{color:var(--green-700);border-bottom-color:var(--green-600);}
.tab-btn:hover{color:var(--ink);}
/* TABLE */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.search-input{position:relative;flex:1;min-width:200px;}
.search-input input{width:100%;padding:9px 12px 9px 32px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:13.8px;background:var(--paper);transition:border-color .15s,box-shadow .15s;}
.search-input input:focus{border-color:var(--green-500);background:var(--white);box-shadow:0 0 0 3px var(--green-100);outline:none;}
.search-input::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#8a8270;font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);background:var(--paper-2);}
thead tr th:first-child{border-top-left-radius:8px;}
thead tr th:last-child{border-top-right-radius:8px;}
tbody td{padding:11px 10px;border-bottom:1px solid var(--paper-2);vertical-align:middle;}
tbody tr{transition:background-color .12s;}
tbody tr:hover{background:var(--green-50);}
.num{font-family:var(--font-mono);text-align:right;}
.tbl-wrap{overflow-x:auto;border-radius:8px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:.1px;}
.badge-green{background:var(--green-100);color:var(--green-700);}
.badge-amber{background:var(--amber-100);color:var(--amber-600);}
.badge-red{background:var(--red-100);color:var(--red-600);}
.badge-grey{background:var(--paper-2);color:#6b6456;}
.icon-btn{background:var(--white);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:13px;transition:background-color .15s,border-color .15s,transform .1s;}
.icon-btn:hover{background:var(--green-50);border-color:var(--green-500);transform:translateY(-1px);}
/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,30,0,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal{background:var(--white);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal.wide{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{font-size:18px;margin:0;font-weight:700;}
.modal-close{background:none;border:none;font-size:20px;color:#8a8270;line-height:1;cursor:pointer;}
.modal-body{padding:22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.form-grid .full{grid-column:1/-1;}
/* TOAST */
.toast-wrap{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--green-900);color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow-md);animation:toastIn .2s ease;}
.toast.err{background:var(--red-600);}
.toast.ok{background:var(--green-700);}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
/* EMPTY STATE */
.empty-state{text-align:center;padding:50px 20px;color:#8a8270;}
.empty-state .em-icon{font-size:34px;margin-bottom:10px;}
.empty-state .em-title{font-weight:600;color:var(--ink);margin-bottom:4px;font-size:16px;}
/* HELP BOX */
.help-box{background:var(--green-50);border:1px solid var(--green-100);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--green-700);margin-bottom:14px;line-height:1.55;}
/* ALERT BOX */
.alert-stok{background:var(--red-100);border:1px solid var(--red-600);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--red-600);margin-bottom:14px;}

/* POINT SIDEBAR BADGE */
.poin-sidebar-info{background:rgba(255,255,255,.08);border-radius:8px;padding:8px 12px;margin:0 12px 10px;font-size:11.5px;color:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:space-between;}
.poin-sidebar-info .pts{font-family:var(--font-mono);font-weight:700;color:#fde047;}

.fin-statement{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:18px;}
.fin-statement-head{background:var(--green-900);color:#fff;padding:18px 24px;}
.fin-statement-head h3{margin:0;font-size:16px;font-weight:800;letter-spacing:.3px;}
.fin-statement-head .fin-sub{font-size:12px;opacity:.82;margin-top:3px;}
.fin-body{padding:4px 24px 18px;}
.fin-section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--green-700);margin:18px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.fin-line{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:13.5px;gap:12px;}
.fin-line .fin-label{color:var(--ink);}
.fin-line .fin-val{font-family:var(--font-mono);font-weight:600;white-space:nowrap;}
.fin-line.indent .fin-label{padding-left:14px;color:#8a8270;font-size:12.5px;}
.fin-line.indent .fin-val{color:#8a8270;font-size:12.5px;}
.fin-line.subtotal{border-top:1px solid var(--line);margin-top:2px;padding-top:9px;font-weight:700;}
.fin-line.total{border-top:2px solid var(--green-900);border-bottom:4px double var(--green-900);margin-top:8px;padding:12px 0;font-weight:800;font-size:16.5px;color:var(--green-900);}
.fin-line.negative .fin-val{color:var(--red-600);}
.fin-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:11.5px;color:#8a8270;padding:10px 24px;border-top:1px solid var(--line);background:var(--paper-2);}
/* POS */
.pos-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;min-width:0;}
@media(max-width:1050px){.pos-grid{grid-template-columns:1fr;}}
.scan-box{display:flex;gap:10px;margin-bottom:14px;}
.scan-box input{flex:1;padding:13px 14px;border:2px solid var(--green-500);border-radius:var(--radius);font-size:15px;font-family:var(--font-mono);background:var(--green-50);}
.pos-catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:520px;overflow-y:auto;padding-right:4px;}
.produk-tile{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;text-align:left;transition:border-color .12s;cursor:pointer;}
.produk-tile:hover{border-color:var(--green-500);box-shadow:var(--shadow-sm);}
.produk-tile .nm{font-weight:600;font-size:13.3px;line-height:1.3;margin-bottom:4px;}
.produk-tile .pr{font-family:var(--font-mono);color:var(--green-700);font-size:13px;}
.produk-tile .st{font-size:11px;color:#8a8270;margin-top:3px;}
.produk-tile:disabled{opacity:.4;cursor:not-allowed;}
.menu-img{width:100%;height:84px;object-fit:cover;border-radius:8px;display:block;margin-bottom:8px;background:var(--green-50);}
.menu-img-ph{width:100%;height:84px;border-radius:8px;margin-bottom:8px;background:var(--green-50);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;}
.menu-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;background:var(--green-50);}
.menu-thumb-ph{width:38px;height:38px;border-radius:8px;flex:none;background:var(--green-50);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;}
.gambar-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.gambar-prev{width:96px;height:96px;border-radius:10px;object-fit:cover;background:var(--green-50);border:1px solid var(--line);}
.gambar-prev-ph{width:96px;height:96px;border-radius:10px;background:var(--green-50);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:40px;}
.cart-panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;}
.cart-items{flex:1;overflow-y:auto;max-height:280px;margin-bottom:12px;}
.cart-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--paper-2);}
.cart-row .nm{flex:1;font-size:13px;font-weight:600;}
.cart-row .sub{font-size:11px;color:#8a8270;}
.qty-ctrl{display:flex;align-items:center;gap:6px;}
.qty-ctrl button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:#fff;font-size:13px;line-height:1;}
.qty-ctrl span{font-family:var(--font-mono);font-size:13px;min-width:18px;text-align:center;}
.cart-row .lt{font-family:var(--font-mono);font-size:13px;min-width:70px;text-align:right;}
.cart-row .rm{background:none;border:none;color:var(--red-600);font-size:14px;cursor:pointer;}
.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.pay-btn{padding:10px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:12.8px;font-weight:600;text-align:center;cursor:pointer;}
.pay-btn.active{border-color:var(--green-600);background:var(--green-100);color:var(--green-700);}
.cart-total-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1.5px dashed var(--line);margin-top:6px;}
.cart-total-row .lbl{font-size:13px;color:#6b6456;}
.cart-total-row .amt{font-family:var(--font-mono);font-size:21px;font-weight:700;color:var(--green-900);}
body.tema-dark .cart-total-row .amt{color:#e2e8f0;}
/* NUMPAD BAYAR */
.bayar-display{display:flex;align-items:center;justify-content:space-between;background:var(--green-900);border-radius:10px;padding:12px 16px;margin-bottom:10px;gap:10px;}
.bayar-display .bd-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.55);margin-bottom:2px;}
.bayar-display .bd-amount{font-family:var(--font-mono);font-size:22px;font-weight:700;color:#fff;letter-spacing:.5px;}
.bayar-display .bd-amount-wrap{display:flex;align-items:baseline;gap:5px;}
.bayar-display .bd-rp{font-family:var(--font-mono);font-size:22px;font-weight:700;color:rgba(255,255,255,.55);}
.bayar-display .bd-amount-input{font-family:var(--font-mono);font-size:22px;font-weight:700;color:#fff;letter-spacing:.5px;background:transparent;border:none;outline:none;padding:0;width:100%;min-width:0;}
.bayar-display .bd-amount-input::placeholder{color:rgba(255,255,255,.35);}
.bayar-display .bd-clear{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:7px;padding:6px 12px;font-size:18px;line-height:1;cursor:pointer;flex-shrink:0;}
.kembalian-bar{display:flex;align-items:center;justify-content:space-between;background:var(--green-50);border:1.5px solid var(--green-100);border-radius:8px;padding:8px 14px;margin-bottom:10px;font-size:13px;}
.kembalian-bar .kb-label{color:var(--green-700);font-weight:600;}
.kembalian-bar .kb-amt{font-family:var(--font-mono);font-weight:700;color:var(--green-700);}
.kembalian-bar.kurang{background:var(--red-100);border-color:var(--red-600);}
.kembalian-bar.kurang .kb-label,.kembalian-bar.kurang .kb-amt{color:var(--red-600);}
.cash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px;}
.cash-tile{padding:12px 6px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--green-700);text-align:center;line-height:1.2;transition:background .1s,border-color .1s,transform .06s;cursor:pointer;}
.cash-tile:active{transform:scale(.95);}
.cash-tile:hover{background:var(--green-50);border-color:var(--green-500);}
.cash-tile.pas{background:var(--amber-100);border-color:var(--amber-500);color:var(--amber-600);grid-column:span 2;}
.cash-tile.pas:hover{background:var(--amber-500);color:#fff;border-color:var(--amber-600);}
/* PRINT — dioptimalkan untuk printer thermal 58mm (area cetak aman ±48mm) */
@media print{
  html,body{width:58mm;margin:0;padding:0;background:#fff;}
  body>*:not(#printNotaArea){display:none !important;}
  #printNotaArea{display:block !important;}
  @page{size:58mm auto;margin:0;}
}
#printNotaArea{
  display:none;width:48mm;max-width:48mm;margin:0 auto;padding:1.5mm 0 3mm;
  font-family:'Courier New',Courier,monospace;font-size:7pt;color:#000;background:#fff;
  line-height:1.45;word-break:break-word;overflow-wrap:break-word;box-sizing:border-box;
}
#printNotaArea *{box-sizing:border-box;max-width:100%;}
#printNotaArea .pn-center{text-align:center;}
#printNotaArea .pn-bold{font-weight:800;}
#printNotaArea .pn-toko{font-size:8.5pt;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:.3px;line-height:1.3;word-break:break-word;}
#printNotaArea .pn-sub{font-size:6.3pt;text-align:center;line-height:1.35;margin-top:.5mm;word-break:break-word;}
#printNotaArea .pn-divider{border:none;border-top:1px dashed #000;margin:1.3mm 0;}
#printNotaArea .pn-divider.tebal{border-top:1px solid #000;margin:1.5mm 0;}
#printNotaArea .pn-row{display:grid;grid-template-columns:1fr auto;column-gap:2mm;align-items:start;font-size:6.6pt;line-height:1.4;}
#printNotaArea .pn-row .l{min-width:0;word-break:break-word;overflow-wrap:break-word;}
#printNotaArea .pn-row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
#printNotaArea .pn-item-block{break-inside:avoid;page-break-inside:avoid;}
#printNotaArea .pn-item-nama{font-size:6.8pt;line-height:1.35;margin-top:1mm;word-break:break-word;overflow-wrap:break-word;}
#printNotaArea .pn-item-rincian{display:grid;grid-template-columns:1fr auto;column-gap:2mm;font-size:6.6pt;color:#000;line-height:1.35;font-variant-numeric:tabular-nums;}
#printNotaArea .pn-item-rincian span:first-child{min-width:0;}
#printNotaArea .pn-item-rincian span:last-child{text-align:right;white-space:nowrap;}
#printNotaArea .pn-total-row{display:grid;grid-template-columns:1fr auto;column-gap:2mm;font-size:7.6pt;font-weight:800;line-height:1.5;letter-spacing:.1px;break-inside:avoid;}
#printNotaArea .pn-footer{text-align:center;font-size:6.6pt;margin-top:2mm;line-height:1.45;word-break:break-word;}
#printNotaArea .pn-footer.up{text-transform:uppercase;font-weight:700;}
</style>

<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="printNotaArea"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ========================= KONSTANTA =========================
const LS_PREFIX = 'warungku_';
const VERSI = '1.0.0';

// ========================= UTILITAS =========================
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function rupiah(n){return 'Rp '+Number(n||0).toLocaleString('id-ID');}
function escapeHtml(s){if(!s&&s!==0)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtDateID(iso){if(!iso)return '—';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTimeID(iso){if(!iso)return '—';const d=new Date(iso);return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}
function fmtDateShortID(iso){if(!iso)return '—';const d=new Date(iso);const dd=String(d.getDate()).padStart(2,'0');const mm=String(d.getMonth()+1).padStart(2,'0');const yy=String(d.getFullYear()).slice(-2);const hh=String(d.getHours()).padStart(2,'0');const mi=String(d.getMinutes()).padStart(2,'0');return `${dd}/${mm}/${yy} ${hh}:${mi}`;}
function daysUntil(iso){if(!iso)return 9999;const d=new Date(iso+'T00:00:00');const now=new Date();return Math.floor((d-now)/(1000*60*60*24));}

// Nomor struk: DDMMYYYY-XXX (urutan transaksi pada tanggal tsb, dimulai dari 001)
function buatNoStruk(tanggalISO){
  const d=new Date(tanggalISO);
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  const localDay=`${yyyy}-${mm}-${dd}`;
  const urutan=state.transaksi.filter(t=>{
    const td=new Date(t.tanggal);
    return `${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,'0')}-${String(td.getDate()).padStart(2,'0')}`===localDay;
  }).length+1;
  return `${dd}${mm}${yyyy}-${String(urutan).padStart(3,'0')}`;
}
// Ambil no. struk transaksi (fallback utk data lama yang belum punya noStruk)
function noStrukTrx(t){return t.noStruk||('...'+String(t.id||'').slice(-6).toUpperCase());}

function toast(msg,type='ok'){
  const w=document.getElementById('toastWrap');
  if(!w)return;
  const t=document.createElement('div');
  t.className='toast '+(type==='err'?'err':'ok');
  t.textContent=msg;
  w.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

// ========================= DATABASE (localStorage) =========================
// Fallback ke penyimpanan memori bila localStorage diblokir (mis. mode privat/sandbox),
// supaya aplikasi tetap berjalan normal walau data tidak diam-diam gagal tersimpan.
const _memStore={};
let _lsTersedia=true;
(function ujiLocalStorage(){
  try{
    const testKey=LS_PREFIX+'__test__';
    localStorage.setItem(testKey,'1');
    localStorage.removeItem(testKey);
    _lsTersedia=true;
  }catch(e){_lsTersedia=false;}
})();
const DB={
  get(key){
    try{
      if(_lsTersedia){const v=localStorage.getItem(LS_PREFIX+key);return v?JSON.parse(v):null;}
      return Object.prototype.hasOwnProperty.call(_memStore,key)?_memStore[key]:null;
    }catch(e){return Object.prototype.hasOwnProperty.call(_memStore,key)?_memStore[key]:null;}
  },
  set(key,val){
    _memStore[key]=val; // selalu simpan cadangan di memori pada sesi berjalan
    try{
      if(_lsTersedia)localStorage.setItem(LS_PREFIX+key,JSON.stringify(val));
    }catch(e){toast('Gagal menyimpan data: '+e.message,'err');}
  },
};

// ========================= STATE =========================
const state={
  session:null,
  route:'dashboard',
  users:[],
  produk:[],
  supplier:[],
  transaksi:[],
  pelanggan:[],
  settings:{
    namaToko:'WarungKu',
    alamat:'',
    telepon:'',
    tema:'default',
    googleClientId:'',
    poin:{aktif:false,rupiahPerPoin:10000,hadiah:[]},
  },
  sync:{
    connected:false,
    accessToken:null,
    tokenExpiry:0,
    lastSync:null,
    backupFileId:null,
    email:'',
  },
  uiFlags:{
    modal:null,
    showDeviceIntro:false,
    produkSearch:'',
    supplierSearch:'',
    pelangganSearch:'',
    kasirSearch:'',

// Kompres gambar (maks 480px, JPEG) agar muat di penyimpanan lokal
function kompresGambar(file,cb){
  if(!file||!file.type.startsWith('image/')){toast('File harus berupa gambar','err');return;}
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const maxS=480;const r=Math.min(1,maxS/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.75));
    };
    img.onerror=()=>toast('Gambar tidak dapat dibaca','err');
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function setGambarForm(dataUrl){
  const h=document.getElementById('fPGambar');if(h)h.value=dataUrl||'';
  const box=document.getElementById('gambarPrevWrap');
  if(box){
    const nm=document.getElementById('fPKategori')?.value;
    box.innerHTML=dataUrl?`<img class="gambar-prev" src="${dataUrl}" alt="Preview">`
      :`<div class="gambar-prev-ph">${EMOJI_KATEGORI[nm]||'🍽️'}</div>`;
  }
  const del=document.getElementById('btnHapusGambar');if(del)del.style.display=dataUrl?'':'none';
}
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='fPGambarFile'){
    kompresGambar(e.target.files[0],d=>setGambarForm(d));
  }
});
document.addEventListener('click',e=>{
  if(e.target&&e.target.id==='btnHapusGambar'){setGambarForm('');const f=document.getElementById('fPGambarFile');if(f)f.value='';}
});

// ========================= BOOT =========================
async function boot(){
  loadAllData();
  applyTema(state.settings.tema||'default');
  // Pastikan ada admin default
  if(!state.users.length){
    state.users=[
      {id:'u1',nama:'Admin',username:'admin',password:'admin123',role:'admin',aktif:true},
      {id:'u2',nama:'Kasir',username:'kasir',password:'kasir123',role:'kasir',aktif:true}
    ];
    DB.set('users',state.users);
  }
  // Tambahkan kasir default jika belum ada (untuk data existing yang hanya punya admin)
  if(state.users.length&&!state.users.find(u=>u.role==='kasir')){
    state.users.push({id:'u2',nama:'Kasir',username:'kasir',password:'kasir123',role:'kasir',aktif:true});
    DB.set('users',state.users);
  }
  // Isi data produk awal (sekali saja, saat belum ada produk sama sekali)
  if(!state.produk.length&&!DB.get('produkSeedDone')){
    state.produk=PRODUK_SEED.map(p=>Object.assign({},p));
    DB.set('produk',state.produk);
    DB.set('produkSeedDone',true);
  }
  const sess=DB.get('session');
  if(sess){
    const u=state.users.find(u=>u.id===sess.id);
    if(u&&u.aktif){state.session=sess;}
  }
  maybeShowDeviceIntro();
  render();
}

function maybeShowDeviceIntro(){
  if(state.session&&state.session.role==='admin'&&!state.sync.connected&&!DB.get('deviceIntroSeen')){
    state.uiFlags.showDeviceIntro=true;
  }
}

function loadAllData(){
  state.users=DB.get('users')||[];
  state.produk=DB.get('produk')||[];
  state.supplier=DB.get('supplier')||[];
  state.transaksi=DB.get('transaksi')||[];
  state.pelanggan=DB.get('pelanggan')||[];
  state.settings=Object.assign({namaToko:'WarungKu',alamat:'',telepon:'',tema:'default',googleClientId:'',poin:{aktif:false,rupiahPerPoin:10000,hadiah:[]}},DB.get('settings')||{});
  if(!state.settings.poin)state.settings.poin={aktif:false,rupiahPerPoin:10000,hadiah:[]};
  if(!Array.isArray(state.settings.poin.hadiah))state.settings.poin.hadiah=[];
  const syncMeta=DB.get('syncMeta')||{};
  state.sync=Object.assign(state.sync,{lastSync:syncMeta.lastSync||null,backupFileId:syncMeta.backupFileId||null});
}

function applyTema(tema){
  document.body.className=tema&&tema!=='default'?'tema-'+tema:'';
}

// ========================= RENDER UTAMA =========================
function render(){
  const app=document.getElementById('app');
  if(!app)return;
  if(!state.session){app.innerHTML=renderLogin();bindLogin();return;}
  app.innerHTML=renderApp();
  bindApp();
}

function salinTeksKeClipboard(teks){
  if(!teks)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(teks).then(()=>toast('ID Perangkat disalin ke clipboard','ok')).catch(()=>toast('Gagal menyalin, salin manual dari kolom teks','err'));
  }else{
    toast('ID Perangkat dipilih, tekan Ctrl+C / Cmd+C untuk menyalin','ok');
  }
}

function bindLogin(){
  const doLogin=()=>{
    const u=document.getElementById('loginUser')?.value.trim();
    const p=document.getElementById('loginPass')?.value.trim();
    const user=state.users.find(x=>x.username===u&&x.password===p&&x.aktif!==false);
    const errEl=document.getElementById('loginErr');
    if(!user){if(errEl){errEl.style.display='flex';errEl.textContent='Username atau password salah.';}}
    else{
      state.session={id:user.id,nama:user.nama,role:user.role};
      DB.set('session',state.session);
      state.route=user.role==='kasir'?'kasir':'dashboard';
      maybeShowDeviceIntro();
      render();
    }
  };
  document.getElementById('btnLogin')?.addEventListener('click',doLogin);
  document.getElementById('loginPass')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

// Sepasang tombol Update (ambil dari Drive) + Simpan ke Drive, dipakai konsisten

  if(!['admin','kasir'].includes(state.session.role))return '';

function renderPage(r){
  if(state.session.role==='kasir'&&r!=='kasir'&&r!=='penjualan'){r=state.route='kasir';}
  if(r==='dashboard')return renderDashboard();
  if(r==='kasir')return renderKasir();
  if(r==='penjualan')return renderPenjualan();
  if(r==='produk')return renderProduk();
  if(r==='supplier')return renderSupplier();
  if(r==='laporan')return renderLaporan();
  if(r==='pelanggan')return renderPelanggan();
  if(r==='pointPelanggan')return renderPointPelanggan();
  if(r==='pengguna')return renderPengguna();
  if(r==='pengaturan')return renderPengaturan();
  if(r==='sinkronisasi')return renderSinkronisasi();
  return '<p>Halaman tidak ditemukan.</p>';
}

function renderDashboard(){
  const today=todayISO();
  const trxHariIni=state.transaksi.filter(t=>t.tanggal.slice(0,10)===today);
  const omsetHari=trxHariIni.reduce((s,t)=>s+t.total,0);
  const trxBulan=state.transaksi.filter(t=>t.tanggal.slice(0,7)===today.slice(0,7));
  const omsetBulan=trxBulan.reduce((s,t)=>s+t.total,0);
  const kritis=state.produk.filter(p=>p.stok<=p.stokMinimum);
  const totalProduk=state.produk.length;
  // Produk terlaris bulan ini
  const itemCount={};
  trxBulan.forEach(t=>t.items.forEach(i=>{itemCount[i.nama]=(itemCount[i.nama]||0)+i.qty;}));
  const terlaris=Object.entries(itemCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return `

    <div class="kpi-card amber"><div class="bar"></div><div class="label">Omset Bulan Ini</div><div class="value">${rupiah(omsetBulan)}</div><div class="sub">${trxBulan.length} transaksi</div></div>
    <div class="kpi-card"><div class="bar"></div><div class="label">Total Menu</div><div class="value">${totalProduk}</div><div class="sub">${kritis.length} stok kritis</div></div>
  </div>

    <div class="card">
      <div class="card-head"><h3>🏆 Menu Terlaris Bulan Ini</h3></div>
      ${terlaris.length?`<table>
        <thead><tr><th>Menu</th><th class="num">Qty Terjual</th></tr></thead>
        <tbody>${terlaris.map(([nm,qty],i)=>`<tr><td>${i+1}. ${escapeHtml(nm)}</td><td class="num">${qty}</td></tr>`).join('')}</tbody>

function renderKasir(){

  const kat=state.uiFlags.kasirKategori||'';
  const metode=state.uiFlags.kasirMetode||'tunai';
  const bayarStr=state.uiFlags.kasirBayar||'';
  const subtotal=cart.reduce((s,i)=>s+i.hargaJual*i.qty,0);
  const bayarNum=parseInt(bayarStr.replace(/\D/g,''))||0;
  const kembalian=bayarNum-subtotal;
  const produkList=state.produk.filter(p=>{
    if(p.stok<=0)return false;
    if(q&&!p.nama.toLowerCase().includes(q)&&!p.barcode.includes(q)&&!p.kategori.toLowerCase().includes(q))return false;
    if(kat&&p.kategori!==kat)return false;
    return true;
  });
  const kats=[...new Set(state.produk.map(p=>p.kategori))].filter(Boolean).sort();
  // Cek apakah nama pelanggan yang diketik cocok dengan pelanggan terdaftar,
  // supaya kasir bisa langsung tukar poin dari layar Kasir tanpa pindah halaman.
  const poinCfg=state.settings.poin||{aktif:false,hadiah:[]};
  const hadiahTersedia=(poinCfg.hadiah||[]);
  const namaInputPlg=(state.uiFlags.kasirNamaPelanggan||'').trim();
  const pelCocokPoin=namaInputPlg?state.pelanggan.find(p=>p.nama.toLowerCase()===namaInputPlg.toLowerCase()):null;

  return `
  <div class="page-head">

      </div>

        ${produkList.length?produkList.map(p=>`
          <button class="produk-tile" data-add-cart="${p.id}" ${p.stok<=0?'disabled':''}>

// ========================= LAPORAN KEUANGAN =========================
function renderLaporan(){
  const period=state.uiFlags.laporanPeriod||'harian';
  const rows=groupTransaksi(period);
  const totalOmset=rows.reduce((s,r)=>s+r.total,0);
  const totalTrx=rows.reduce((s,r)=>s+r.jumlahTrx,0);
  const totalHppHadiah=rows.reduce((s,r)=>s+(r.hppHadiah||0),0);
  const totalHPP=rows.reduce((s,r)=>s+r.hpp,0)-totalHppHadiah; // HPP penjualan asli (tanpa beban hadiah poin)
  const totalLaba=rows.reduce((s,r)=>s+r.laba,0);
  const margin=totalOmset?(totalLaba/totalOmset*100):0;
  const periodLabel={harian:'Harian',mingguan:'Mingguan',bulanan:'Bulanan'}[period];
  const totalPenukaran=rows.reduce((s,r)=>s+(r.jumlahTukarPoin||0),0);
  const totalPoinDitukar=rows.reduce((s,r)=>s+(r.poinDitukar||0),0);

  // Rekap per produk (khusus transaksi jual, tidak termasuk penukaran poin)
  const rekapProduk={};
  state.transaksi.filter(t=>t.metodeBayar!=='tukar_poin').forEach(t=>t.items.forEach(i=>{
    if(!rekapProduk[i.nama])rekapProduk[i.nama]={nama:i.nama,qty:0,omset:0,hpp:0};
    rekapProduk[i.nama].qty+=i.qty;
    rekapProduk[i.nama].omset+=i.hargaJual*i.qty;
    rekapProduk[i.nama].hpp+=(i.hargaBeli||0)*i.qty;
  }));
  const rekapList=Object.values(rekapProduk).sort((a,b)=>b.omset-a.omset).slice(0,15);

  // Rincian & rekap penukaran poin per pelanggan — untuk melacak siapa saja
  // pelanggan yang menukar poin, kapan, dan berapa beban (HPP) yang tercatat.
  const penukaranDetail=getPenukaranPoinDetail();
  const rekapPoin=getRekapPenukaranPerPelanggan();

  const toko=state.settings;
  return `
  <div class="page-head">
    <div><h1>📈 Laporan Keuangan</h1><p class="desc">Rekap omset, HPP, dan laba warung makan.</p></div>
    <div class="head-actions">
      <button class="btn btn-ghost" id="btnExportCSV">⬇ Unduh CSV</button>
      ${driveSyncBtn()}
    </div>
  </div>
  <div class="fin-statement" style="margin-bottom:14px;">
    <div class="fin-statement-head" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;">
      <div>
        <h3>${escapeHtml(toko.namaToko||'Warung Makan')}</h3>
        <div class="fin-sub">${toko.alamat?escapeHtml(toko.alamat):'Alamat belum diatur'}${toko.telepon?' • '+escapeHtml(toko.telepon):''}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;font-weight:700;letter-spacing:.3px;">LAPORAN KEUANGAN — ${periodLabel.toUpperCase()}</div>
        <div class="fin-sub">Dicetak ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</div>
      </div>
    </div>
  </div>
  <div class="tabs">
    ${['harian','mingguan','bulanan'].map(p=>`<button class="tab-btn ${period===p?'active':''}" data-laporan-period="${p}">${{harian:'Harian',mingguan:'Mingguan',bulanan:'Bulanan'}[p]}</button>`).join('')}
  </div>
  <div class="kpi-row">
    <div class="kpi-card"><div class="bar"></div><div class="label">Total Omset</div><div class="value" style="font-size:18px;">${rupiah(totalOmset)}</div><div class="sub">${rows.length} periode, ${totalTrx} transaksi</div></div>
    <div class="kpi-card amber"><div class="bar"></div><div class="label">HPP (Modal Jual)</div><div class="value" style="font-size:18px;">${rupiah(totalHPP)}</div><div class="sub">modal menu terjual</div></div>
    <div class="kpi-card"><div class="bar"></div><div class="label">Laba Kotor</div><div class="value" style="font-size:18px;color:var(--green-700);">${rupiah(totalLaba)}</div><div class="sub">margin ${margin.toFixed(1)}%</div></div>
    <div class="kpi-card amber"><div class="bar"></div><div class="label">🎁 Pengeluaran Tukar Poin</div><div class="value" style="font-size:18px;">${rupiah(totalHppHadiah)}</div><div class="sub">${totalPenukaran}x • ${totalPoinDitukar.toLocaleString('id-ID')} poin ditukar</div></div>
  </div>
  <div class="fin-statement">
    <div class="fin-statement-head">

      <div class="fin-sub">Periode ${periodLabel} • Warung Makan</div>
    </div>
    <div class="fin-body">
      <div class="fin-section-label">Pendapatan</div>
      <div class="fin-line"><span class="fin-label">Penjualan Bersih</span><span class="fin-val">${rupiah(totalOmset)}</span></div>

function groupTransaksi(period){
  const map={};
  state.transaksi.forEach(t=>{
    const d=t.tanggal.slice(0,10);
    let key=d;
    if(period==='mingguan'){
      const dd=new Date(d+'T00:00:00');
      const mon=new Date(dd);mon.setDate(dd.getDate()-dd.getDay()+1);
      key=mon.toISOString().slice(0,10);
    }else if(period==='bulanan')key=d.slice(0,7);
    if(!map[key])map[key]={key,jumlahTrx:0,total:0,hpp:0,laba:0,tunai:0,transfer:0,qris:0,debit:0,jumlahTukarPoin:0,poinDitukar:0,hppHadiah:0};
    map[key].jumlahTrx++;
    map[key].total+=t.total;
    const hpp=t.items.reduce((s,i)=>s+(i.hargaBeli||0)*i.qty,0);
    map[key].hpp+=hpp;
    map[key].laba+=t.total-hpp;
    if(t.metodeBayar==='tunai')map[key].tunai+=t.total;
    else if(t.metodeBayar==='transfer')map[key].transfer+=t.total;
    else if(t.metodeBayar==='qris')map[key].qris+=t.total;
    else if(t.metodeBayar==='debit')map[key].debit+=t.total;
    else if(t.metodeBayar==='tukar_poin'){map[key].jumlahTukarPoin++;map[key].poinDitukar+=(t.poinDitukar||0);map[key].hppHadiah+=hpp;}
  });
  return Object.values(map).sort((a,b)=>b.key>a.key?1:-1);
}
// Rincian seluruh transaksi penukaran poin, terbaru lebih dulu — dipakai untuk
// melacak "siapa pelanggan yang menukar poin" di Laporan Keuangan & ekspor CSV.
function getPenukaranPoinDetail(){
  return state.transaksi
    .filter(t=>t.metodeBayar==='tukar_poin')
    .map(t=>({t,hpp:t.items.reduce((s,i)=>s+(i.hargaBeli||0)*i.qty,0)}))
    .sort((a,b)=>new Date(b.t.tanggal)-new Date(a.t.tanggal));
}
// Rekap penukaran poin dikelompokkan per nama pelanggan (siapa paling sering/banyak menukar poin)
function getRekapPenukaranPerPelanggan(){
  const map={};
  getPenukaranPoinDetail().forEach(({t,hpp})=>{
    const key=t.namaPelanggan&&t.namaPelanggan.trim()?t.namaPelanggan.trim():'(Tanpa nama pelanggan)';
    if(!map[key])map[key]={nama:key,noWa:t.noWaPelanggan||'',jumlah:0,totalPoin:0,totalBeban:0,terakhir:t.tanggal};
    map[key].jumlah++;
    map[key].totalPoin+=(t.poinDitukar||0);
    map[key].totalBeban+=hpp;
    if(!map[key].noWa&&t.noWaPelanggan)map[key].noWa=t.noWaPelanggan;
    if(new Date(t.tanggal)>new Date(map[key].terakhir))map[key].terakhir=t.tanggal;
  });
  return Object.values(map).sort((a,b)=>b.totalBeban-a.totalBeban);
}
function formatPeriodLabel(key,period){
  if(period==='harian')return fmtDateID(key);
  if(period==='mingguan'){const d=new Date(key+'T00:00:00');return 'Minggu '+d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});}
  const[y,m]=key.split('-');return new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
}

function bindPointPelanggan(){
  // Update preview perhitungan poin
  function updatePreview(){
    const rph=parseInt(document.getElementById('ppRupiahPerPoin')?.value)||10000;
    const minB=parseInt(document.getElementById('ppMinBelanja')?.value)||0;
    const calc=(total)=>{
      if(minB>0&&total<minB)return '0 (belum min.)';
      return Math.floor(total/rph);
    };
    const el50=document.getElementById('prevPoin50k');
    const el100=document.getElementById('prevPoin100k');
    const el500=document.getElementById('prevPoin500k');
    if(el50)el50.textContent=calc(50000);
    if(el100)el100.textContent=calc(100000);
    if(el500)el500.textContent=calc(500000);
  }
  updatePreview();
  document.getElementById('ppRupiahPerPoin')?.addEventListener('input',updatePreview);
  document.getElementById('ppMinBelanja')?.addEventListener('input',updatePreview);

  // Simpan pengaturan poin
  document.getElementById('btnSavePoinPengaturan')?.addEventListener('click',()=>{
    if(!state.settings.poin)state.settings.poin={aktif:false,rupiahPerPoin:10000,minBelanja:0,hadiah:[],masaBerlaku:0,pesanStruk:''};
    state.settings.poin.aktif=document.getElementById('ppAktif')?.value==='1';
    state.settings.poin.rupiahPerPoin=parseInt(document.getElementById('ppRupiahPerPoin')?.value)||10000;
    state.settings.poin.minBelanja=parseInt(document.getElementById('ppMinBelanja')?.value)||0;
    state.settings.poin.masaBerlaku=parseInt(document.getElementById('ppMasaBerlaku')?.value)||0;
    state.settings.poin.pesanStruk=document.getElementById('ppPesanStruk')?.value||'Terima kasih! Poin Anda bertambah.';
    DB.set('settings',state.settings);
    toast('✅ Pengaturan poin disimpan','ok');
    render();
  });

  // Tambah hadiah
  document.getElementById('btnTambahHadiah2')?.addEventListener('click',()=>{
    const poinNum=parseInt(document.getElementById('ppHadiahPoin')?.value)||0;
    const produkId=document.getElementById('ppHadiahProduk')?.value||'';
    const qty=parseInt(document.getElementById('ppHadiahQty')?.value)||1;
    const ket=(document.getElementById('ppHadiahKet')?.value||'').trim();
    if(!poinNum||!produkId){toast('Isi poin dan pilih menu hadiah','err');return;}
    const prod=state.produk.find(p=>p.id===produkId);
    if(!prod){toast('Menu tidak ditemukan','err');return;}
    if(!state.settings.poin)state.settings.poin={aktif:false,rupiahPerPoin:10000,minBelanja:0,hadiah:[]};
    state.settings.poin.hadiah.push({id:'HD'+uid(),poin:poinNum,produkId:prod.id,nama:prod.nama,qty,ket});
    DB.set('settings',state.settings);toast('Hadiah ditambahkan','ok');render();
  });

  // Hapus hadiah
  document.querySelectorAll('[data-del-hadiah2]').forEach(b=>b.addEventListener('click',()=>{
    if(confirm('Hapus hadiah ini?')){
      state.settings.poin.hadiah=state.settings.poin.hadiah.filter(h=>h.id!==b.dataset.delHadiah2);
      DB.set('settings',state.settings);toast('Hadiah dihapus','ok');render();
    }
  }));

  // Search & sort
  document.getElementById('searchPoint')?.addEventListener('input',e=>{state.uiFlags.pointSearch=e.target.value;render();});
  document.getElementById('sortPoint')?.addEventListener('change',e=>{state.uiFlags.pointSort=e.target.value;render();});

  // Tukar poin dari halaman point
  document.querySelectorAll('[data-tukar-poin2]').forEach(b=>b.addEventListener('click',()=>{
    const p=state.pelanggan.find(x=>x.id===b.dataset.tukarPoin2);
    if(p){state.uiFlags.modal={type:'tukarPoin',data:p};render();}
  }));

  // Tambah poin manual
  document.querySelectorAll('[data-tambah-poin]').forEach(b=>b.addEventListener('click',()=>{
    const p=state.pelanggan.find(x=>x.id===b.dataset.tambahPoin);
    if(p){state.uiFlags.modal={type:'tambahPoinManual',data:p};render();}
  }));

  // Cetak/kirim struk dari Riwayat Penukaran Poin
  document.querySelectorAll('[data-print-trx-point]').forEach(b=>b.addEventListener('click',()=>{
    const t=state.transaksi.find(x=>x.id===b.dataset.printTrxPoint);
    if(t)cetakNota(t);
  }));
  document.querySelectorAll('[data-wa-trx-point]').forEach(b=>b.addEventListener('click',()=>{
    const t=state.transaksi.find(x=>x.id===b.dataset.waTrxPoint);
    if(t)kirimStrukWA(t);
  }));
}

  }));

// Dropdown submenu di navbar (Inventori / Laporan & Data / Admin, dst)
// Panel diposisikan via JS (position:fixed) supaya tidak terpotong oleh
// overflow-x:auto pada .topbar-nav (yang dibutuhkan untuk scroll di layar sempit).
function bindNavDropdowns(){
  const dropdowns=document.querySelectorAll('.topbar-nav [data-dropdown]');
  function closeAll(){
    dropdowns.forEach(o=>o.classList.remove('open'));
  }
  function positionMenu(dd){
    const toggle=dd.querySelector('[data-dropdown-toggle]');
    const menu=dd.querySelector('.nav-dropdown-menu');
    if(!toggle||!menu)return;
    const r=toggle.getBoundingClientRect();
    const menuW=menu.offsetWidth||210;
    let left=r.left;
    if(left+menuW>window.innerWidth-8)left=Math.max(8,window.innerWidth-8-menuW);
    menu.style.left=left+'px';
    menu.style.top=(r.bottom+4)+'px';
  }
  dropdowns.forEach(dd=>{
    const toggle=dd.querySelector('[data-dropdown-toggle]');
    toggle?.addEventListener('click',e=>{
      e.stopPropagation();
      const isOpen=dd.classList.contains('open');
      closeAll();
      if(!isOpen){
        dd.classList.add('open');
        positionMenu(dd);
      }
    });
  });
  if(dropdowns.length && !window.__navDropdownOutsideBound){
    window.__navDropdownOutsideBound=true;
    document.addEventListener('click',()=>{
      document.querySelectorAll('.topbar-nav [data-dropdown].open').forEach(o=>o.classList.remove('open'));
    });
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape')document.querySelectorAll('.topbar-nav [data-dropdown].open').forEach(o=>o.classList.remove('open'));
    });
    window.addEventListener('resize',()=>{
      document.querySelectorAll('.topbar-nav [data-dropdown].open').forEach(o=>o.classList.remove('open'));
    });
    // Kalau yang scroll adalah topbar-nav sendiri (mis. browser auto-scroll
    // horizontal saat tombol dropdown fokus di layar sempit), reposisikan
    // saja panelnya — jangan ditutup. Scroll di luar itu (mis. halaman
    // utama) baru menutup dropdown karena posisinya bisa jadi tidak akurat.
    document.addEventListener('scroll',e=>{
      const nav=e.target && e.target.closest ? e.target.closest('.topbar-nav') : null;
      if(nav){
        document.querySelectorAll('.topbar-nav [data-dropdown].open').forEach(positionMenu);
      }else{
        document.querySelectorAll('.topbar-nav [data-dropdown].open').forEach(o=>o.classList.remove('open'));
      }
    },true);
  }
}

function bindDeviceIntro(){
  if(!state.uiFlags.showDeviceIntro)return;
  const dismissForever=()=>{
    state.uiFlags.showDeviceIntro=false;
    DB.set('deviceIntroSeen',true);
    render();
  };
  document.getElementById('deviceIntroClose')?.addEventListener('click',dismissForever);
  document.getElementById('deviceIntroCloseBtn')?.addEventListener('click',dismissForever);
  document.getElementById('deviceIntroSkip')?.addEventListener('click',()=>{
    state.uiFlags.showDeviceIntro=false;render();
  });
  document.getElementById('deviceIntroConnect')?.addEventListener('click',async()=>{
    const clientId=(document.getElementById('deviceIntroClientId')?.value||'').trim();
    if(clientId){state.settings.googleClientId=clientId;DB.set('settings',state.settings);}
    const ok=await driveConnect();
    if(ok){state.uiFlags.showDeviceIntro=false;render();}
  });
}

function bindPageEvents(){
  const r=state.route;
  if(r==='kasir')bindKasir();
  if(r==='penjualan')bindPenjualan();

function bindKasir(){
  // ── Pencarian produk: update katalog langsung tanpa render() penuh ──
  let kasirSearchTimer=null;
  const kasirSearchEl=document.getElementById('kasirSearch');
  const katalogEl=document.querySelector('.pos-catalog');

  function filterKatalog(q){
    const kat=state.uiFlags.kasirKategori||'';
    const ql=q.toLowerCase();
    const produkList=state.produk.filter(p=>{
      if(p.stok<=0)return false;
      if(ql&&!p.nama.toLowerCase().includes(ql)&&!(p.barcode||'').includes(ql)&&!p.kategori.toLowerCase().includes(ql))return false;
      if(kat&&p.kategori!==kat)return false;
      return true;
    });
    if(!katalogEl)return;
    if(!produkList.length){
      katalogEl.innerHTML=`<div class="empty-state" style="grid-column:1/-1;"><div class="em-icon">📦</div><div class="em-title">Tidak ada menu</div></div>`;
    }else{
      katalogEl.innerHTML=produkList.map(p=>`
        <button class="produk-tile" data-add-cart="${p.id}">
          ${menuImg(p)}
          <div class="nm">${escapeHtml(p.nama)}</div>
          <div class="pr">${rupiah(p.hargaJual)}</div>
          <div class="st">Stok: ${p.stok} ${escapeHtml(p.satuan)}</div>
        </button>`).join('');
      // Re-bind tile click
      katalogEl.querySelectorAll('[data-add-cart]').forEach(b=>b.addEventListener('click',()=>{
        const p=state.produk.find(x=>x.id===b.dataset.addCart);
        if(!p||p.stok<=0)return;
        const cart=state.uiFlags.kasirCart;
        const existing=cart.find(i=>i.produkId===p.id);
        if(existing){
          if(existing.qty>=p.stok){toast('Stok tidak cukup','err');return;}
          existing.qty++;
        }else{
          cart.push({produkId:p.id,nama:p.nama,hargaJual:p.hargaJual,hargaBeli:p.hargaBeli||0,satuan:p.satuan||'pcs',qty:1});
        }
        state.uiFlags.kasirCart=[...cart];
        render();
      }));
    }
  }

  kasirSearchEl?.addEventListener('input',e=>{
    state.uiFlags.kasirSearch=e.target.value;
    clearTimeout(kasirSearchTimer);
    kasirSearchTimer=setTimeout(()=>filterKatalog(e.target.value),120);
  });

  document.querySelectorAll('[data-kasir-kat]').forEach(b=>b.addEventListener('click',()=>{state.uiFlags.kasirKategori=b.dataset.kasirKat;render();}));
  document.querySelectorAll('[data-add-cart]').forEach(b=>b.addEventListener('click',()=>{
    const p=state.produk.find(x=>x.id===b.dataset.addCart);
    if(!p||p.stok<=0)return;
    const cart=state.uiFlags.kasirCart;
    const existing=cart.find(i=>i.produkId===p.id);
    if(existing){
      if(existing.qty>=p.stok){toast('Stok tidak cukup','err');return;}
      existing.qty++;
    }else{
      cart.push({produkId:p.id,nama:p.nama,hargaJual:p.hargaJual,hargaBeli:p.hargaBeli||0,satuan:p.satuan||'pcs',qty:1});
    }
    state.uiFlags.kasirCart=[...cart];
    render();
  }));
  document.querySelectorAll('[data-qty-plus]').forEach(b=>b.addEventListener('click',()=>{
    const idx=parseInt(b.dataset.qtyPlus);
    const item=state.uiFlags.kasirCart[idx];
    const p=state.produk.find(x=>x.id===item.produkId);
    if(p&&item.qty>=p.stok){toast('Stok tidak cukup','err');return;}
    state.uiFlags.kasirCart[idx].qty++;
    render();
  }));
  document.querySelectorAll('[data-qty-minus]').forEach(b=>b.addEventListener('click',()=>{
    const idx=parseInt(b.dataset.qtyMinus);
    if(state.uiFlags.kasirCart[idx].qty>1)state.uiFlags.kasirCart[idx].qty--;
    else state.uiFlags.kasirCart.splice(idx,1);
    render();
  }));
  document.querySelectorAll('[data-rm-cart]').forEach(b=>b.addEventListener('click',()=>{
    state.uiFlags.kasirCart.splice(parseInt(b.dataset.rmCart),1);render();
  }));
  document.querySelectorAll('[data-metode]').forEach(b=>b.addEventListener('click',()=>{
    state.uiFlags.kasirMetode=b.dataset.metode;render();
  }));
  document.querySelectorAll('[data-cash]').forEach(b=>b.addEventListener('click',()=>{
    const cur=parseInt((state.uiFlags.kasirBayar||'').replace(/\D/g,''))||0;
    state.uiFlags.kasirBayar=String(cur+parseInt(b.dataset.cash));render();
  }));
  document.querySelectorAll('[data-cash-pas]').forEach(b=>b.addEventListener('click',()=>{
    state.uiFlags.kasirBayar=b.dataset.cashPas;render();
  }));
  document.getElementById('btnBayarClear')?.addEventListener('click',()=>{state.uiFlags.kasirBayar='';render();});
  document.getElementById('inputUangDiterima')?.addEventListener('input',e=>{
    const raw=e.target.value.replace(/\D/g,'');
    const num=raw?parseInt(raw,10):0;
    e.target.value=raw?num.toLocaleString('id-ID'):'';
    state.uiFlags.kasirBayar=raw?String(num):'';

  // ── Nama pelanggan: autocomplete + autofill No WA ──
  const namaPelEl=document.getElementById('kasirNamaPelanggan');
  const noWaEl=document.getElementById('kasirNoWaPelanggan');
  namaPelEl?.addEventListener('input',e=>{
    state.uiFlags.kasirNamaPelanggan=e.target.value;
    // Autofill No WA jika nama cocok persis dengan data pelanggan
    const cocok=state.pelanggan.find(p=>p.nama.toLowerCase()===e.target.value.trim().toLowerCase());
    if(cocok&&cocok.noWa&&noWaEl&&!noWaEl.value){
      noWaEl.value=cocok.noWa;

    }
  });
  // Juga trigger saat user pilih dari datalist (change event)
  namaPelEl?.addEventListener('change',e=>{
    state.uiFlags.kasirNamaPelanggan=e.target.value;
    const cocok=state.pelanggan.find(p=>p.nama.toLowerCase()===e.target.value.trim().toLowerCase());

// Update kembalian & status tombol tanpa render ulang penuh, agar fokus input uang diterima tidak hilang saat mengetik
function updateBayarUI(){
  const cart=state.uiFlags.kasirCart||[];
  const subtotal=cart.reduce((s,i)=>s+i.hargaJual*i.qty,0);
  const bayarStr=state.uiFlags.kasirBayar||'';
  const bayarNum=parseInt(bayarStr.replace(/\D/g,''))||0;
  const kembalian=bayarNum-subtotal;
  const kbBar=document.querySelector('.kembalian-bar');
  if(kbBar){
    kbBar.classList.toggle('kurang',kembalian<0&&!!bayarStr);
    const lbl=kbBar.querySelector('.kb-label');
    const amt=kbBar.querySelector('.kb-amt');
    if(lbl)lbl.textContent=(kembalian<0&&bayarStr)?'Kurang Bayar':'Kembalian dari Total Belanja';
    if(amt)amt.textContent=bayarStr?rupiah(Math.abs(kembalian)):'—';
  }
  const btn=document.getElementById('btnSelesaikanTrx');
  if(btn){
    const metode=state.uiFlags.kasirMetode||'tunai';
    btn.disabled=(metode==='tunai'&&bayarNum<subtotal&&!!bayarStr);
  }
}

function selesaikanTrx(){
  const cart=state.uiFlags.kasirCart;
  if(!cart.length){toast('Keranjang kosong','err');return;}
  const metode=state.uiFlags.kasirMetode||'tunai';
  const subtotal=cart.reduce((s,i)=>s+i.hargaJual*i.qty,0);
  const bayarNum=metode==='tunai'?parseInt((state.uiFlags.kasirBayar||'').replace(/\D/g,''))||0:subtotal;
  if(metode==='tunai'&&bayarNum<subtotal){toast('Uang kurang dari total!','err');return;}
  // Cek stok
  for(const item of cart){
    const p=state.produk.find(x=>x.id===item.produkId);
    if(!p||p.stok<item.qty){toast(`Stok ${item.nama} tidak cukup`,'err');return;}
  }
  // Kurangi stok
  cart.forEach(item=>{
    const p=state.produk.find(x=>x.id===item.produkId);
    if(p)p.stok-=item.qty;
  });
  DB.set('produk',state.produk);
  // Hitung poin loyalitas
  const poinCfg=state.settings.poin||{aktif:false,rupiahPerPoin:10000,minBelanja:0};
  const minBelanja=poinCfg.minBelanja||0;
  const memenuhi=!minBelanja||subtotal>=minBelanja;
  const poinDidapat=(poinCfg.aktif&&memenuhi)?Math.floor(subtotal/(poinCfg.rupiahPerPoin||10000)):0;
  // Buat transaksi
  const trxTanggal=new Date().toISOString();
  const trx={
    id:'TRX'+Date.now().toString(36).toUpperCase(),
    noStruk:buatNoStruk(trxTanggal),
    tanggal:trxTanggal,
    kasirId:state.session.id,
    kasirNama:state.session.nama,
    items:cart.map(i=>({...i})),
    total:subtotal,
    metodeBayar:metode,
    uangDiterima:metode==='tunai'?bayarNum:subtotal,
    kembalian:metode==='tunai'?bayarNum-subtotal:0,
    namaPelanggan:state.uiFlags.kasirNamaPelanggan||'',
    noWaPelanggan:(state.uiFlags.kasirNoWaPelanggan||'').trim(),
    poinDidapat:0,
    poinSetelah:0,
  };
  state.transaksi.push(trx);
  DB.set('transaksi',state.transaksi);
  // Simpan/update pelanggan
  if(trx.namaPelanggan){
    const nm=trx.namaPelanggan.trim();
    let pel=state.pelanggan.find(p=>p.nama.toLowerCase()===nm.toLowerCase());
    if(pel){
      pel.jumlahTrx=(pel.jumlahTrx||1)+1;pel.totalBelanja=(pel.totalBelanja||0)+subtotal;pel.terakhirTrx=todayISO();
      if(trx.noWaPelanggan)pel.noWa=trx.noWaPelanggan;
      pel.poin=(pel.poin||0)+poinDidapat;
    }else{
      pel={id:'PLG'+uid(),nama:nm,noWa:trx.noWaPelanggan||'',terdaftar:todayISO(),terakhirTrx:todayISO(),jumlahTrx:1,totalBelanja:subtotal,poin:poinDidapat};
      state.pelanggan.push(pel);
    }
    trx.poinDidapat=poinDidapat;
    trx.poinSetelah=pel.poin;
    DB.set('pelanggan',state.pelanggan);
    DB.set('transaksi',state.transaksi);
  }
  // Reset kasir
  state.uiFlags.kasirCart=[];state.uiFlags.kasirBayar='';state.uiFlags.kasirNamaPelanggan='';state.uiFlags.kasirNoWaPelanggan='';
  toast(`✅ Transaksi berhasil! Kembalian: ${rupiah(trx.kembalian)}${trx.poinDidapat?` • +${trx.poinDidapat} poin`:''}`,'ok');
  cetakNota(trx);
  if(trx.noWaPelanggan)kirimStrukWA(trx);
  render();
}

// Deteksi produk dengan data yang kelihatan rusak (biasanya hasil import CSV yang salah pisah kolom):
// nama mengandung notasi ilmiah (mis. "8,98191E+12") atau tanggal mentah (dd/mm/yyyy) di dalamnya,
// atau nama-nya sangat panjang seperti satu baris CSV utuh.
function isProdukRusak(p){
  const nm=p.nama||'';
  if(/\d[.,]?\d*[eE]\+\d+/.test(nm))return true;      // notasi ilmiah nyasar ke nama
  if(/\d{1,2}\/\d{1,2}\/\d{4}/.test(nm))return true;  // tanggal nyasar ke nama
  if(nm.length>90)return true;                        // nama tidak wajar panjang (ciri 1 baris CSV utuh)
  if((nm.match(/\d+/g)||[]).length>=4)return true;     // terlalu banyak angka terpisah di nama (ciri banyak kolom nyampur)
  return false;
}

async function bersihkanDataProdukRusak(){
  const rusak=state.produk.filter(isProdukRusak);
  if(!rusak.length){toast('Tidak ditemukan data menu yang rusak','ok');return;}
  const contoh=rusak.slice(0,3).map(p=>`"${p.nama.slice(0,50)}${p.nama.length>50?'…':''}"`).join(', ');
  if(!confirm(`Ditemukan ${rusak.length} produk dengan data yang rusak/tidak wajar (contoh: ${contoh}).\n\nIni biasanya hasil import CSV yang gagal terbaca dengan benar. Hapus semua data rusak ini?`))return;
  state.produk=state.produk.filter(p=>!isProdukRusak(p));
  DB.set('produk',state.produk);
  toast(`${rusak.length} menu rusak berhasil dihapus`,'ok');
  render();
  if(state.sync.connected){
    await driveUpload(true);
    toast('Perubahan disinkronkan ke Google Drive','ok');
    render();
  }
}

// ========================= CRUD PRODUK =========================
// Cari produk yang sudah ada dengan barcode sama (prioritas) atau nama sama (case-insensitive)
function cariProdukDuplikat(nama,barcode,excludeId){
  const bc=(barcode||'').trim();
  const nm=(nama||'').trim().toLowerCase();
  return state.produk.find(x=>{
    if(excludeId&&x.id===excludeId)return false;
    if(bc&&x.barcode&&x.barcode.trim()===bc)return true;
    if(!bc&&nm&&x.nama&&x.nama.trim().toLowerCase()===nm)return true;
    return false;
  });
}

function saveProduk(){
  const id=document.getElementById('btnSaveProduk')?.dataset.id;
  const nama=document.getElementById('fPNama')?.value.trim();
  if(!nama){toast('Nama menu wajib diisi','err');return;}
  const data={
    nama,
    barcode:document.getElementById('fPBarcode')?.value.trim()||'',
    kategori:document.getElementById('fPKategori')?.value||KATEGORI_SEMBAKO[0],
    satuan:document.getElementById('fPSatuan')?.value||'pcs',
    stok:parseInt(document.getElementById('fPStok')?.value)||0,
    stokMinimum:parseInt(document.getElementById('fPStokMin')?.value)||5,
    hargaBeli:parseInt(document.getElementById('fPHargaBeli')?.value)||0,
    hargaJual:parseInt(document.getElementById('fPHargaJual')?.value)||0,
    expired:document.getElementById('fPExpired')?.value||'',
    supplierId:document.getElementById('fPSupplier')?.value||'',
    gambar:document.getElementById('fPGambar')?.value||'',
  };
  if(id){
    const idx=state.produk.findIndex(x=>x.id===id);
    if(idx>=0)state.produk[idx]={...state.produk[idx],...data};
  }else{
    // Cek duplikat (barcode atau nama sama) sebelum menambah produk baru
    const dup=cariProdukDuplikat(data.nama,data.barcode,null);
    if(dup){
      const ok=confirm(`Produk "${dup.nama}" (${dup.barcode?'barcode '+dup.barcode:'nama sama'}) sudah ada di data.\n\nTekan OK untuk TIMPA data lama dengan data baru ini, atau Cancel untuk membatalkan.`);
      if(!ok){toast('Dibatalkan, menu tidak disimpan (sudah ada)','err');return;}
      const idx=state.produk.findIndex(x=>x.id===dup.id);
      state.produk[idx]={...state.produk[idx],...data};
      DB.set('produk',state.produk);
      state.uiFlags.modal=null;toast('Menu lama ditimpa dengan data baru','ok');render();
      return;
    }
    state.produk.push({id:'PRD'+uid(),...data});
  }
  DB.set('produk',state.produk);
  state.uiFlags.modal=null;toast(id?'Menu diperbarui':'Menu ditambahkan','ok');render();
}

function tukarPoin(){
  const id=document.getElementById('btnKonfirmasiTukarPoin')?.dataset.id;
  const pel=state.pelanggan.find(x=>x.id===id);
  if(!pel){toast('Pelanggan tidak ditemukan','err');return;}
  const sel=document.getElementById('fTukarHadiah');
  const opt=sel?.options[sel.selectedIndex];
  if(!opt){toast('Pilih hadiah terlebih dahulu','err');return;}
  const poinDibutuhkan=parseInt(opt.dataset.poin)||0;
  const produkId=opt.dataset.produkId||'';
  const qtyHadiah=parseInt(opt.dataset.qty)||1;
  const namaHadiah=opt.textContent.split(' — ')[0];
  const prod=state.produk.find(x=>x.id===produkId);
  if(!prod){toast('Menu hadiah tidak ditemukan (mungkin sudah dihapus)','err');return;}
  if(prod.stok<qtyHadiah){toast(`Stok "${prod.nama}" tidak cukup untuk hadiah ini`,'err');return;}
  if((pel.poin||0)<poinDibutuhkan){toast('Poin pelanggan tidak cukup','err');return;}
  if(!confirm(`Tukar ${poinDibutuhkan} poin milik ${pel.nama} dengan hadiah "${namaHadiah}" (${qtyHadiah}x)?\n\nStok "${prod.nama}" akan berkurang ${qtyHadiah}, dan HPP-nya tercatat sebagai pengeluaran di Laporan (tidak ada laba yang diterima).`))return;
  // Kurangi stok produk yang dijadikan hadiah
  prod.stok-=qtyHadiah;
  DB.set('produk',state.produk);
  pel.poin=(pel.poin||0)-poinDibutuhkan;
  DB.set('pelanggan',state.pelanggan);
  // Catat riwayat penukaran ke transaksi — item hadiah dicatat dgn harga jual 0 (tidak ada omset)
  // namun HPP (hargaBeli) tetap tercatat sehingga masuk sebagai pengeluaran/beban di Laporan.
  const trxTukar={
    id:'TUKAR'+Date.now().toString(36).toUpperCase(),
    noStruk:'TUKAR-'+new Date().toISOString().slice(0,10).replace(/-/g,''),
    tanggal:new Date().toISOString(),
    kasirId:state.session.id,
    kasirNama:state.session.nama,
    items:[{produkId:prod.id,nama:prod.nama,qty:qtyHadiah,hargaJual:0,hargaBeli:prod.hargaBeli||0,satuan:prod.satuan||'pcs'}],
    total:0,
    metodeBayar:'tukar_poin',
    uangDiterima:0,kembalian:0,
    namaPelanggan:pel.nama,
    noWaPelanggan:pel.noWa||'',
    poinDidapat:0,poinSetelah:pel.poin,
    poinDitukar:poinDibutuhkan,
    hadiahDitukar:namaHadiah,
  };
  state.transaksi.push(trxTukar);
  DB.set('transaksi',state.transaksi);
  state.uiFlags.modal=null;
  toast(`🎁 Berhasil ditukar! ${pel.nama} mendapat "${namaHadiah}", sisa poin: ${pel.poin}`,'ok');
  cetakNota(trxTukar);
  if(trxTukar.noWaPelanggan)kirimStrukWA(trxTukar);
  render();
}

    </div>

    <div class="pn-divider"></div>

      <div class="pn-item-block">

    <div class="pn-divider"></div>
    <div class="pn-row"><span class="l">${metode}</span><span class="r">${t.metodeBayar==='tunai'?rupiah(t.uangDiterima||t.total):'LUNAS'}</span></div>
    ${t.metodeBayar==='tunai'?`<div class="pn-row"><span class="l">Kembali</span><span class="r">${rupiah(t.kembalian||0)}</span></div>`:''}

  requestAnimationFrame(()=>{

      const doPrint=()=>window.print();
