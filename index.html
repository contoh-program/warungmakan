// ========================= KIRIM STRUK WA =========================
function buildStrukText(t){
  const toko=state.settings;
  const garis='-------------------------------';
  const metode=metodeBayarLabel[t.metodeBayar]||t.metodeBayar;
  let s=`*${(toko.namaToko||'Warung').toUpperCase()}*\n`;
  if(toko.alamat)s+=`${toko.alamat}\n`;
  if(toko.telepon)s+=`${toko.telepon}\n`;
  s+=`${garis}\n`;
  s+=`${noStrukTrx(t)}   ${fmtDateShortID(t.tanggal)}\n`;
  s+=`Kasir: ${t.kasirNama}${t.namaPelanggan?`   Plg: ${t.namaPelanggan}`:''}\n`;
  s+=`${garis}\n`;
  if(t.metodeBayar==='tukar_poin'){
    s+=`🎁 *PENUKARAN POIN*\n`;
    s+=`${t.hadiahDitukar||'Hadiah'}\n`;
    s+=`Poin ditukar: -${(t.poinDitukar||0).toLocaleString('id-ID')} pts\n`;
    s+=`${garis}\n`;
    s+=`Sisa Poin: ${(t.poinSetelah||0).toLocaleString('id-ID')} pts\n`;
    s+=`${garis}\n`;
    s+=`*DIBAYAR DENGAN POIN*\n`;
  }else{
    t.items.forEach(i=>{
      s+=`${i.nama}\n`;
      s+=`${i.qty} ${i.satuan||'pcs'} x ${rupiah(i.hargaJual)} = ${rupiah(i.hargaJual*i.qty)}\n`;
    });
    s+=`${garis}\n`;
    s+=`*TOTAL: ${rupiah(t.total)}*\n`;
    s+=`${garis}\n`;
    s+=`${metode}: ${t.metodeBayar==='tunai'?rupiah(t.uangDiterima||t.total):'LUNAS'}\n`;
    if(t.metodeBayar==='tunai')s+=`*Kembali: ${rupiah(t.kembalian||0)}*\n`;
    if(t.poinDidapat){
      s+=`${garis}\n`;
      s+=`🎁 Poin Diperoleh: +${t.poinDidapat}\n`;
      s+=`Total Poin Anda: ${t.poinSetelah||0}\n`;
    }
  }
  s+=`${garis}\n`;
  s+=`*TERIMA KASIH, SELAMAT BERBELANJA KEMBALI*`;
  if(toko.catatanStruk&&toko.catatanStruk!=='Terima kasih telah berbelanja!')s+=`\n${toko.catatanStruk}`;
  return s;
}

// ========================= STRUK PDF =========================
function buildStrukLines(t){
  const toko=state.settings;
  const lebar=26;
  const garis='-'.repeat(lebar);
  const pad=(s,r,w)=>{s=String(s);r=String(r);const sp=w-s.length-r.length;return s+(sp>0?' '.repeat(Math.max(sp,1)):' ')+r;};
  const metode=metodeBayarLabel[t.metodeBayar]||t.metodeBayar;
  const lines=[];
  lines.push({text:(toko.namaToko||'Warung').toUpperCase(),bold:true,center:true});
  if(toko.alamat)lines.push({text:toko.alamat,center:true,small:true});
  if(toko.telepon)lines.push({text:toko.telepon,center:true,small:true});
  lines.push({text:garis});
  lines.push({text:pad(noStrukTrx(t),fmtDateShortID(t.tanggal),lebar),small:true});
  lines.push({text:pad('Kasir: '+t.kasirNama,t.namaPelanggan?('Plg: '+t.namaPelanggan):'',lebar),small:true});
  lines.push({text:garis});
  if(t.metodeBayar==='tukar_poin'){
    lines.push({text:'*** PENUKARAN POIN ***',bold:true,center:true,small:true});
    lines.push({text:(t.hadiahDitukar||'Hadiah').slice(0,lebar)});
    lines.push({text:pad('Poin ditukar','-'+(t.poinDitukar||0).toLocaleString('id-ID')+' pts',lebar),small:true});
    lines.push({text:garis});
    lines.push({text:pad('Sisa Poin',(t.poinSetelah||0).toLocaleString('id-ID')+' pts',lebar)});
    lines.push({text:garis});
    lines.push({text:pad('DIBAYAR DENGAN','POIN',lebar),bold:true});
  }else{
    t.items.forEach(i=>{
      lines.push({text:i.nama.slice(0,lebar)});
      lines.push({text:pad(i.qty+' '+(i.satuan||'pcs')+' x '+rupiah(i.hargaJual).replace('Rp ',''),rupiah(i.hargaJual*i.qty).replace('Rp ',''),lebar),small:true});
    });
    lines.push({text:garis});
    lines.push({text:pad('TOTAL',rupiah(t.total),lebar),bold:true});
    lines.push({text:garis});
    lines.push({text:pad(metode,t.metodeBayar==='tunai'?rupiah(t.uangDiterima||t.total):'LUNAS',lebar)});
    if(t.metodeBayar==='tunai')lines.push({text:pad('Kembali',rupiah(t.kembalian||0),lebar)});
    if(t.poinDidapat){
      lines.push({text:garis});
      lines.push({text:pad('Poin Diperoleh','+'+t.poinDidapat,lebar)});
      lines.push({text:pad('Total Poin Anda',String(t.poinSetelah||0),lebar)});
    }
  }
  lines.push({text:garis});
  lines.push({text:'TERIMA KASIH, SELAMAT',bold:true,center:true,small:true});
  lines.push({text:'BERBELANJA KEMBALI',bold:true,center:true,small:true});

function generateStrukPDFDoc(t){
  if(!window.jspdf||!window.jspdf.jsPDF){toast('Library PDF belum siap, coba lagi sebentar','err');return null;}
  const {jsPDF}=window.jspdf;
  const lines=buildStrukLines(t);
  const lineH=4.3,marginTop=7,marginBottom=9,maxW=52;
  // Pass 1: gunakan dokumen sementara untuk mengukur berapa baris hasil word-wrap
  // setiap teks (mencegah teks saling tumpuk kalau ada baris yang melebihi lebar kertas).
  const ukur=new jsPDF({unit:'mm',format:[58,200]});
  let totalBaris=0;
  const wrappedCache=lines.map(ln=>{
    ukur.setFont('courier',ln.bold?'bold':'normal');
    ukur.setFontSize(ln.small?7:8);
    const wrapped=ukur.splitTextToSize(String(ln.text||' '),maxW);
    totalBaris+=wrapped.length;
    return wrapped;
  });
  const heightMm=Math.max(marginTop+totalBaris*lineH+marginBottom,40);
  const doc=new jsPDF({unit:'mm',format:[58,heightMm]});
  let y=marginTop;
  lines.forEach((ln,idx)=>{
    doc.setFont('courier',ln.bold?'bold':'normal');
    doc.setFontSize(ln.small?7:8);
    const wrapped=wrappedCache[idx];
    if(ln.center){
      doc.text(wrapped,29,y,{align:'center'});
    }else{
      doc.text(wrapped,3,y);
    }
    y+=wrapped.length*lineH;
  });
  return doc;
}

function unduhStrukPDF(t){
  const doc=generateStrukPDFDoc(t);
  if(!doc)return;
  doc.save(`struk_${noStrukTrx(t)}.pdf`);
  toast('Struk PDF berhasil diunduh','ok');
}

function csvEscape(v){
  v=(v===undefined||v===null)?'':String(v);
  return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}

// Ubah tanggal YYYY-MM-DD (format internal) -> DD/MM/YYYY (format file CSV/Excel)
function isoToDMY(iso){
  if(!iso)return '';
  const m=String(iso).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return iso;
  return `${m[3]}/${m[2]}/${m[1]}`;
}

// Ubah tanggal DD/MM/YYYY (dari file CSV/Excel) -> YYYY-MM-DD (format internal)
function dmyToIso(dmy){
  if(!dmy)return '';
  const s=String(dmy).trim();
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){
    const dd=m[1].padStart(2,'0'),mm=m[2].padStart(2,'0'),yyyy=m[3];
    return `${yyyy}-${mm}-${dd}`;
  }
  // sudah dalam format YYYY-MM-DD (backward compatible dengan file lama)
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  return s;
}

// Parser satu baris CSV dengan pemisah ';' yang mendukung kolom bertanda kutip
function parseCSVLine(line,delimiter=';'){
  const cols=[];
  let cur='',inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQuotes){
      if(ch==='"'){
        if(line[i+1]==='"'){cur+='"';i++;}
        else inQuotes=false;
      }else cur+=ch;
    }else{
      if(ch==='"')inQuotes=true;
      else if(ch===delimiter){cols.push(cur);cur='';}
      else cur+=ch;
    }
  }
  cols.push(cur);
  return cols;
}

// Kolom barcode yang dibuka/disimpan lewat Excel kadang berubah jadi notasi ilmiah
// (mis. "8,98191E+12"). Fungsi ini mencoba mengembalikannya ke angka penuh.
function normalizeBarcode(v){
  if(!v)return '';
  let s=String(v).trim();
  const sci=s.match(/^(\d+),?(\d*)[eE]\+?(\d+)$/);
  if(sci){
    const num=parseFloat(s.replace(',','.'));
    if(!isNaN(num))return num.toFixed(0);
  }
  return s;
}

function importProdukCSV(file){
  const reader=new FileReader();
  reader.onload=async e=>{
    let text=e.target.result;
    if(text.charCodeAt(0)===0xFEFF)text=text.slice(1); // buang BOM kalau ada
    const lines=text.split(/\r?\n/).filter(l=>l&&l.trim());
    if(!lines.length){toast('File CSV kosong atau tidak valid','err');return;}

    // Deteksi otomatis pemisah kolom: coba ';' dan ',' pada beberapa baris data pertama,
    // pilih yang menghasilkan jumlah kolom paling konsisten (mendekati 9-10 kolom sesuai template).
    const kandidatBaris=lines.slice(1,6).length?lines.slice(1,6):lines.slice(0,5);
    function skorDelimiter(d){
      return kandidatBaris.reduce((acc,l)=>acc+Math.abs(parseCSVLine(l,d).length-9),0);
    }
    const delimiter=[';',',','\t'].reduce((best,d)=>skorDelimiter(d)<skorDelimiter(best)?d:best,';');

    const rows=[];
    const barisGagal=[];
    for(let i=1;i<lines.length;i++){
      const cols=parseCSVLine(lines[i],delimiter);
      if(!cols[0]||!cols[0].trim())continue;
      const p={
        nama:cols[0]?.trim()||'',
        barcode:normalizeBarcode(cols[1]?.trim()),
        kategori:cols[2]?.trim()||KATEGORI_SEMBAKO[0],
        satuan:cols[3]?.trim()||'pcs',
        stok:parseInt(cols[4])||0,
        stokMinimum:parseInt(cols[5])||5,
        hargaBeli:parseInt(cols[6])||0,
        hargaJual:parseInt(cols[7])||0,
        expired:dmyToIso(cols[8]?.trim()),
        supplierId:'',
      };
      // Cuma tolak kalau nama-nya sendiri kelihatan rusak (bukan sekadar kolom lain kosong)
      if(isProdukRusak(p)){barisGagal.push(lines[i]);continue;}
      rows.push(p);
    }
    if(!rows.length){
      const contoh=barisGagal[0]?barisGagal[0].slice(0,120):(lines[1]||'').slice(0,120);
      toast(`Tidak ada baris valid dari ${lines.length-1} baris data. Contoh baris pertama: "${contoh}${contoh.length>=120?'…':''}" — cek apakah pemisah kolom filenya benar (';' atau ',').`,'err');
      return;
    }

    // Deteksi baris yang datanya sama dengan produk yang sudah ada (barcode atau nama sama)
    const duplikat=rows.filter(r=>cariProdukDuplikat(r.nama,r.barcode,null));
    let timpaDuplikat=false;
    if(duplikat.length){
      timpaDuplikat=confirm(`Ditemukan ${duplikat.length} produk di CSV yang sama dengan data yang sudah ada (barcode/nama sama), contoh: "${duplikat[0].nama}".\n\nTekan OK untuk TIMPA data lama dengan data dari CSV.\nTekan Cancel untuk LEWATI baris ini (data lama tetap dipakai), hanya produk baru yang akan ditambahkan.`);
    }

    let ditambah=0,ditimpa=0,dilewati=0;
    for(const p of rows){
      const dup=cariProdukDuplikat(p.nama,p.barcode,null);
      if(dup){
        if(timpaDuplikat){
          const idx=state.produk.findIndex(x=>x.id===dup.id);
          state.produk[idx]={...state.produk[idx],...p};
          ditimpa++;
        }else{
          dilewati++;
        }
        continue;
      }
      state.produk.push({id:'PRD'+uid(),...p});
      ditambah++;
    }
    DB.set('produk',state.produk);
    const ringkasan=[
      ditambah?`${ditambah} produk baru ditambahkan`:null,
      ditimpa?`${ditimpa} produk lama ditimpa`:null,
      dilewati?`${dilewati} produk dilewati (sudah ada)`:null,
      barisGagal.length?`${barisGagal.length} baris dilewati karena data tidak wajar`:null,
    ].filter(Boolean).join(', ');
    toast(ringkasan||'Tidak ada perubahan data','ok');
    render();
    if((ditambah||ditimpa)&&state.sync.connected){
      await driveUpload(true);
      toast('Data hasil import CSV disinkronkan ke Google Drive','ok');
      render();
    }
  };
  reader.readAsText(file);
}

function csvCell(v){

  return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}

const DRIVE_BACKUP_NAME='warungku-backup.json';
let tokenClient=null;
let autoSyncTimer=null;

function loadGis(){
  return new Promise((resolve,reject)=>{
    if(window.google&&window.google.accounts&&window.google.accounts.oauth2){resolve();return;}
    const sc=document.createElement('script');
    sc.src='https://accounts.google.com/gsi/client';
    sc.async=true;sc.defer=true;
    sc.onload=()=>resolve();
    sc.onerror=()=>reject(new Error('Gagal memuat Google Identity Services. Periksa koneksi internet Anda.'));
    document.head.appendChild(sc);
  });
}

function driveConnect(){
  return new Promise(async(resolve)=>{
    const clientId=(state.settings.googleClientId||'').trim();
    if(location.protocol==='file:'){toast('Tidak bisa login Google dari file lokal (file://). Hosting aplikasi ini terlebih dahulu (Netlify, Vercel, GitHub Pages, dll).','err');resolve(false);return;}
    if(!clientId){toast('Isi dan simpan Google OAuth Client ID terlebih dahulu','err');resolve(false);return;}
    try{await loadGis();}catch(e){toast(e.message,'err');resolve(false);return;}
    try{
      tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:'https://www.googleapis.com/auth/drive.file',
        callback:async(resp)=>{
          if(resp.error){toast('Gagal menyambungkan akun Google: '+resp.error,'err');resolve(false);return;}
          state.sync.accessToken=resp.access_token;
          state.sync.tokenExpiry=Date.now()+((resp.expires_in||3600)*1000);
          state.sync.connected=true;
          DB.set('syncMeta',{lastSync:state.sync.lastSync,backupFileId:state.sync.backupFileId});
          DB.set('deviceIntroSeen',true);
          toast('Akun Google Drive tersambung','ok');
          render();
          // Cek & ambil data dari Drive terlebih dahulu secara manual sebelum auto-sync berjalan,
          // supaya data lokal tidak menimpa data yang sudah ada di Drive.
          await checkExistingBackup();
          startAutoSync();
          resolve(true);
        },
        error_callback:(err)=>{toast('Gagal menyambungkan akun Google: '+(err?.message||'dibatalkan'),'err');resolve(false);},
      });
      tokenClient.requestAccessToken({prompt:'consent'});
    }catch(e){toast('Gagal memulai proses login Google: '+e.message,'err');resolve(false);}
  });
}

function driveDisconnect(){
  if(state.sync.accessToken&&window.google?.accounts?.oauth2){
    google.accounts.oauth2.revoke(state.sync.accessToken,()=>{});
  }
  state.sync.accessToken=null;state.sync.connected=false;state.sync.tokenExpiry=0;
  stopAutoSync();
  toast('Akun Google Drive diputuskan','ok');render();
}

async function driveFindBackupFile(){
  const q=encodeURIComponent(`name='${DRIVE_BACKUP_NAME}' and trashed=false`);
  const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`,{
    headers:{Authorization:'Bearer '+state.sync.accessToken}
  });
  if(!res.ok)throw new Error('Gagal mengecek Drive (status '+res.status+')');
  const data=await res.json();
  return (data.files&&data.files[0])||null;
}

async function checkExistingBackup(){
  try{
    toast('🔍 Mengecek backup di Google Drive…','ok');
    const f=await driveFindBackupFile();
    if(f){
      state.sync.backupFileId=f.id;
      DB.set('syncMeta',{lastSync:state.sync.lastSync,backupFileId:state.sync.backupFileId});
      if(confirm('Ditemukan backup di Google Drive (terakhir diubah '+new Date(f.modifiedTime).toLocaleString('id-ID')+'). Ambil data dari Drive sekarang? (Data lokal saat ini akan diganti)')){
        await driveDownload();
      }else{
        toast('Melewati pengambilan data. Auto-sync akan mulai menyimpan data setiap 10 menit di latar belakang.','ok');
      }
    }else{
      toast('Belum ada backup di Drive. Auto-sync akan mulai menyimpan data setiap 10 menit di latar belakang.','ok');
    }
  }catch(e){toast(e.message,'err');}
}

function buildBackupPayload(){
  return {
    versi:VERSI,tanggal:new Date().toISOString(),
    produk:state.produk,supplier:state.supplier,transaksi:state.transaksi,
    pelanggan:state.pelanggan,users:state.users,settings:state.settings,
  };
}

async function driveUpload(silent){
  if(!state.sync.connected){if(!silent)toast('Sambungkan akun Google Drive terlebih dahulu','err');return;}
  try{
    const payload=JSON.stringify(buildBackupPayload(),null,2);
    let fileId=state.sync.backupFileId;
    if(!fileId){
      const existing=await driveFindBackupFile();
      if(existing)fileId=existing.id;
    }
    const boundary='warungboundary';
    const metaPart=fileId?'{}':JSON.stringify({name:DRIVE_BACKUP_NAME,mimeType:'application/json'});
    const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metaPart}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
    const url=fileId?`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`:`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res=await fetch(url,{
      method:fileId?'PATCH':'POST',
      headers:{Authorization:'Bearer '+state.sync.accessToken,'Content-Type':`multipart/related; boundary=${boundary}`},
      body,
    });
    if(!res.ok)throw new Error('Upload ke Drive gagal (status '+res.status+')');
    const data=await res.json();
    state.sync.backupFileId=data.id;
    state.sync.lastSync=new Date().toISOString();
    DB.set('syncMeta',{lastSync:state.sync.lastSync,backupFileId:state.sync.backupFileId});
    if(!silent){toast('Data berhasil disimpan ke Google Drive','ok');render();}
    else{
      const jam=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
      toast('☁️ Auto-sync: data tersimpan ke Google Drive ('+jam+')','ok');
    }
  }catch(e){
    if(!silent)toast(e.message,'err');
    else toast('⚠️ Auto-sync gagal: '+e.message,'err');
  }
}

async function driveDownload(){
  if(!state.sync.connected){toast('Sambungkan akun Google Drive terlebih dahulu','err');return;}
  try{
    let fileId=state.sync.backupFileId;
    if(!fileId){
      const existing=await driveFindBackupFile();
      if(!existing){toast('Belum ada backup di Google Drive','err');return;}
      fileId=existing.id;
    }
    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{
      headers:{Authorization:'Bearer '+state.sync.accessToken}
    });
    if(!res.ok)throw new Error('Gagal mengambil data dari Drive (status '+res.status+')');
    const data=await res.json();
    if(!data.produk&&!data.transaksi){toast('File backup di Drive tidak valid','err');return;}
    state.sync.backupFileId=fileId;
    if(data.produk)state.produk=data.produk;
    if(data.supplier)state.supplier=data.supplier;
    if(data.transaksi)state.transaksi=data.transaksi;
    if(data.pelanggan)state.pelanggan=data.pelanggan;
    if(data.users)state.users=data.users;
    if(data.settings)state.settings=Object.assign(state.settings,data.settings);
    DB.set('produk',state.produk);DB.set('supplier',state.supplier);
    DB.set('transaksi',state.transaksi);
    DB.set('pelanggan',state.pelanggan);DB.set('users',state.users);DB.set('settings',state.settings);
    state.sync.lastSync=new Date().toISOString();
    DB.set('syncMeta',{lastSync:state.sync.lastSync,backupFileId:state.sync.backupFileId});
    toast('Data berhasil diambil dari Google Drive','ok');
    applyTema(state.settings.tema||'default');
    render();
  }catch(e){toast(e.message,'err');}
}

function startAutoSync(){
  stopAutoSync();
  autoSyncTimer=setInterval(()=>{if(state.sync.connected)driveUpload(true);},10*60*1000);
}
function stopAutoSync(){
  if(autoSyncTimer){clearInterval(autoSyncTimer);autoSyncTimer=null;}
}

// ========================= INIT =========================
boot();
</script>
